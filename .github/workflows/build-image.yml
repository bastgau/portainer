name: Build image

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        type: choice
        options: [amd64, arm64]
        default: amd64
  push:
    branches: [build-image]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/portainer
  ARCH: ${{ inputs.arch || 'amd64' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install client dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build client and server
        run: make build-client build-server ENV=production PLATFORM=linux ARCH=${{ env.ARCH }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/linux/Dockerfile
          platforms: linux/${{ env.ARCH }}
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:registry-auth-distribution-${{ env.ARCH }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ env.ARCH }}
